name: Build Midnight Munch (iOS)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: EAS iOS preview build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Link Expo project
        run: npx eas-cli@latest init --force --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS preview
        run: npx eas-cli@latest build --platform ios --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
