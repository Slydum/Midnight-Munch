name: Midnight Munch Native Check
on:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native-check.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/native-check.yml"]
  workflow_dispatch:
jobs:
  expo-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npx expo export --platform all
      - run: npx tsc --noEmit
