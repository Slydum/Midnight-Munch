<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#606C38" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Midnight Munch" />
    <meta name="description" content="Shared household meal planner and step-by-step cooking buddy." />
    <title>Midnight Munch</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"><p style="padding:24px;font-family:system-ui">Loading Midnight Munch…</p></div>
    <script>
      window.addEventListener('error', (event) => {
        const root = document.getElementById('root');
        if (root) root.innerHTML = '<pre style="padding:24px;white-space:pre-wrap;font:14px system-ui;color:#8b1e1e">Midnight Munch could not start.\n' + String(event.message || 'A script failed to load') + '\n\nRefresh the page. If this keeps happening, send this message to support.</pre>';
      });
      window.addEventListener('unhandledrejection', (event) => {
        const root = document.getElementById('root');
        if (root) root.innerHTML = '<pre style="padding:24px;white-space:pre-wrap;font:14px system-ui;color:#8b1e1e">Midnight Munch hit an error.\n' + String(event.reason?.message || event.reason || 'Unknown error') + '</pre>';
      });
    </script>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
