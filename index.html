<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#606C38" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Midnight Munch" />
    <meta name="description" content="Shared household meal planner and step-by-step cooking buddy." />
    <title>Midnight Munch</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"><p style="padding:24px;font-family:system-ui">Loading Midnight Munch…</p></div>
    <script>
      window.__MM_MODULE_LOADED__ = false;
      window.addEventListener('error', (event) => {
        const root = document.getElementById('root');
        if (root && event.message) root.innerHTML = '<pre style="padding:24px;white-space:pre-wrap;font:14px system-ui;color:#8b1e1e">Startup error: ' + String(event.message) + '</pre>';
      });
      window.addEventListener('unhandledrejection', (event) => {
        const root = document.getElementById('root');
        if (root) root.innerHTML = '<pre style="padding:24px;white-space:pre-wrap;font:14px system-ui;color:#8b1e1e">Startup error: ' + String(event.reason?.message || event.reason || 'Unknown error') + '</pre>';
      });
      window.setTimeout(() => {
        const root = document.getElementById('root');
        if (root && !window.__MM_MODULE_LOADED__) {
          root.innerHTML = '<pre style="padding:24px;white-space:pre-wrap;font:14px system-ui;color:#8b1e1e">The Midnight Munch JavaScript bundle did not load. This is a deployment asset-loading problem, not a phone setting. Please send this screen to support.</pre>';
        }
      }, 7000);
    </script>
    <script type="module" src="./src/main.jsx"
      onload="window.__MM_MODULE_LOADED__ = true"
      onerror="document.getElementById('root').innerHTML = '<pre style=&quot;padding:24px;font:14px system-ui;color:#8b1e1e&quot;>Could not download the Midnight Munch app bundle. Please try again shortly.</pre>'"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
